<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; form-action 'none'; base-uri 'none'">
  <title>桌宠菜单</title><link rel="stylesheet" href="pet-menu.css"><script src="pet-menu.js" defer></script>
</head>
<body>
  <main id="card" class="card" hidden>
    <header class="head">
      <div id="avatar" class="avatar" aria-hidden="true"></div>
      <div class="who">
        <div id="name" class="name"></div>
        <div class="status"><span id="state-dot" class="state-dot"></span><span id="state-text"></span><span id="source" class="source"></span></div>
      </div>
      <button type="button" id="settings" class="head-btn" title="形象、大小、跟随哪些会话、互动开关"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2z"/><path d="M16.2 11.4l1.3 1-1.6 2.8-1.6-.6a6 6 0 0 1-1.7 1l-.3 1.7H9.1l-.3-1.7a6 6 0 0 1-1.7-1l-1.6.6-1.6-2.8 1.3-1a6 6 0 0 1 0-2l-1.3-1 1.6-2.8 1.6.6a6 6 0 0 1 1.7-1l.3-1.7h3.2l.3 1.7a6 6 0 0 1 1.7 1l1.6-.6 1.6 2.8-1.3 1a6 6 0 0 1 0 2z"/></svg>设置</button>
      <button type="button" id="close" class="icon-btn" title="关闭（Esc）" aria-label="关闭"><svg viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8"/></svg></button>
    </header>
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="常用操作"></div>
    <section class="actions" aria-labelledby="actions-title">
      <div class="sec-head"><span id="actions-title">动作</span><small>点一下就播放，直接打字可搜索</small></div>
      <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.2"/><path d="M13 13l3.5 3.5"/></svg><input id="search" type="text" autocomplete="off" spellcheck="false" aria-label="搜索动作"><span id="count" class="count"></span></label>
      <div id="browse" class="browse">
        <div id="tabs" class="tabs" role="tablist" aria-label="动作分类" aria-orientation="vertical"></div>
        <div id="items" class="items" role="tabpanel"></div>
      </div>
    </section>
    <section id="demo-block" class="demos">
      <button type="button" id="demo-toggle" class="section-toggle" aria-expanded="false" aria-controls="demos"><span class="sec-title">互动演示</span><small>和一位同伴一起演一段</small><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 8l3 3 3-3"/></svg></button>
      <div id="demos" class="chips" hidden></div>
    </section>
    <footer id="foot" class="foot"></footer>
  </main>
</body>
</html>
